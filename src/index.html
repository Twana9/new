<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>twana</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button class="btn">SUBSCRIBE</button>
    <button class="btn2">JOIN</button>
    <div style="display: grid; grid-template-columns: 100px 100px">
      <div style="background-color: aqua">div 1</div>
      <div style="background-color: pink">div 2</div>
    </div>
    <div
      style="
        display: grid;
        margin-top: 30px;
        grid-template-columns: 100px 1fr 2fr;
      "
    >
      <div style="background-color: aqua">div 1</div>
      <div style="background-color: pink">
        div 2
        <p>text</p>
      </div>
      <div style="background-color: pink">
        div 2
        <p>text</p>
      </div>
    </div>

    <div
      style="
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        margin-top: 30px;
        column-gap: 20px;
        row-gap: 40px;
      "
    >
      <div style="background-color: aqua; height: 200px">div 1</div>
      <div style="background-color: pink; height: 200px">div 2</div>
      <div style="background-color: aqua; height: 200px">div 1</div>
      <div style="background-color: pink; height: 200px">div 2</div>
      <div style="background-color: aqua; height: 200px">div 1</div>
      <div style="background-color: pink; height: 200px">div 1</div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
