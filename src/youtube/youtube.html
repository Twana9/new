<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube</title>
    <link rel="stylesheet" href="youtubeStyle.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <input class="search-bar" type="text" placeholder="Search" />
    <div class="video-preview">
      <div class="">
        <img class="thumbnail-1" src="images/thumbnail-1.webp" alt="" />
      </div>
      <div class="second-part">
        <div class="profile-picture">
          <img src="images/channel-1.jpeg" alt="" />
        </div>
        <div>
          <p class="video-title">
            Talking Tech and AI with Google CEO Sundar Pichai!
          </p>
        </div>
      </div>
      <div class="video-info">
        <p class="video-status">3.4M Views &#183; 6 months ago</p>
        <p class="video-auther">Marques Brownlee &#10003;</p>
        <p class="video-subtitle">
          Talking tech and AI on the heels of Google I/O. Also a daily driver
          phone reveal from Google's CEO. Shoutout to Sundar!
        </p>
      </div>
    </div>
  </body>
</html>
